[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pressurant-sizer"
version = "0.1.0"
description = "Real-gas (Peng-Robinson) sizing of pressurant bottles for liquid rockets, cold-gas thrusters and test stands"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ivan Sushko"}]
requires-python = ">=3.9"
keywords = ["rocketry", "pressurant", "peng-robinson", "real-gas", "cold-gas", "aerospace", "engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
coolprop = ["CoolProp"]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
pressurant = "pressurant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
